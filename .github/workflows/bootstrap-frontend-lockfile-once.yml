name: Bootstrap Frontend Lockfile Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate and commit package-lock.json
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stop if lockfile already exists
        id: lockfile
        shell: bash
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 22
        if: steps.lockfile.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Generate and validate lockfile
        if: steps.lockfile.outputs.exists != 'true'
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          test -s package-lock.json
          npm ci --ignore-scripts

      - name: Commit generated lockfile
        if: steps.lockfile.outputs.exists != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "chore(frontend): bootstrap package-lock.json"
          git push origin HEAD:main
