name: Bootstrap Ruff Safe Fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-ruff-fixes.yml'

permissions:
  contents: write

jobs:
  ruff-safe-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply only Ruff safe fixes
        working-directory: backend
        run: ruff check app tests --fix --exit-zero

      - name: Show diff
        run: git diff --check && git diff

      - name: Commit safe fixes when present
        run: |
          if git diff --quiet; then
            echo 'No Ruff safe fixes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests
          git commit -m 'style: apply Ruff safe fixes'
          git push
