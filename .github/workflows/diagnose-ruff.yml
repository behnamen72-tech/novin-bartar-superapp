name: Diagnose CI Failures

# Fresh diagnostic capture after removing the temporary unsafe Ruff workflow.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-ruff.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Capture Ruff JSON
        working-directory: backend
        run: ruff check app tests --output-format=json > ../ruff-findings.json || true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Capture frontend diagnostics
        run: bash scripts/ci/frontend-checks.sh > frontend-diagnostics.txt 2>&1 || true

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ruff-findings
          path: ruff-findings.json
          if-no-files-found: error

      - name: Upload frontend diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend-diagnostics.txt
          if-no-files-found: error
