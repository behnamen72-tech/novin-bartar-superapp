name: Apply Claude-Approved Mypy Remediation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-format-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply approved annotation-only fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(filename: str, old: str, new: str) -> None:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{filename}: expected one exact match, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replacements = {
              'backend/app/api/v1/routes/documents.py': [
                  ('    document_type: str | None = Query(default=None, max_length=100),',
                   '    document_type: Annotated[str | None, Query(max_length=100)] = None,'),
                  ('    document_status: DocumentStatus | None = Query(default=None, alias="status"),',
                   '    document_status: Annotated[DocumentStatus | None, Query(alias="status")] = None,'),
                  ('    entity_type: DocumentLinkEntityType | None = Query(default=None),',
                   '    entity_type: Annotated[DocumentLinkEntityType | None, Query()] = None,'),
                  ('    entity_id: UUID | None = Query(default=None),',
                   '    entity_id: Annotated[UUID | None, Query()] = None,'),
                  ('    q: str | None = Query(default=None, min_length=1, max_length=200),',
                   '    q: Annotated[str | None, Query(min_length=1, max_length=200)] = None,'),
              ],
              'backend/app/api/v1/routes/workflow.py': [
                  ('    instance_status: WorkflowInstanceStatus | None = Query(default=None, alias="status"),',
                   '    instance_status: Annotated[WorkflowInstanceStatus | None, Query(alias="status")] = None,'),
              ],
              'backend/app/core/access/admin_service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('    has_permission,\n    require_permission_for_organization,',
                   '    has_permission,\n    organization_is_in_scope,\n    require_permission_for_organization,'),
                  ('    organization_ids_in_scope,\n    organization_is_in_scope,',
                   '    organization_ids_in_scope,'),
                  ('def _role_statement(role_id: UUID, *, for_update: bool = False):',
                   'def _role_statement(\n    role_id: UUID, *, for_update: bool = False\n) -> Select[tuple[Role]]:'),
                  ('                "Cannot reactivate access without an active person relationship at the assignment organization."',
                   '                "Cannot reactivate access without an active person relationship "\n'
                   '                "at the assignment organization."'),
              ],
              'backend/app/core/audit/service.py': [
                  ('from uuid import UUID', 'from collections.abc import Mapping\nfrom uuid import UUID'),
                  ('    before_state: dict[str, object] | None = None,',
                   '    before_state: Mapping[str, object] | None = None,'),
                  ('    after_state: dict[str, object] | None = None,',
                   '    after_state: Mapping[str, object] | None = None,'),
                  ('    metadata: dict[str, object] | None = None,',
                   '    metadata: Mapping[str, object] | None = None,'),
              ],
              'backend/app/core/audit/security.py': [
                  ('from datetime import date, datetime',
                   'from collections.abc import Mapping\nfrom datetime import date, datetime'),
                  ('    payload: dict[str, object] | None,',
                   '    payload: Mapping[str, object] | None,'),
                  ('    sanitized = sanitize_audit_value(payload)',
                   '    sanitized = sanitize_audit_value(dict(payload))'),
              ],
              'backend/app/core/config.py': [
                  ('                "COMMERCE_INTEGRATION_JWT_SECRET must be a dedicated random secret of at least 32 characters."',
                   '                "COMMERCE_INTEGRATION_JWT_SECRET must be a dedicated random secret "\n'
                   '                "of at least 32 characters."'),
              ],
              'backend/app/core/documents/service.py': [
                  ('        raise original_error', '        raise original_error from None'),
              ],
              'backend/app/core/identity/admin_service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('def _user_statement(user_id: UUID, *, for_update: bool = False):',
                   'def _user_statement(\n    user_id: UUID, *, for_update: bool = False\n) -> Select[tuple[User]]:'),
              ],
              'backend/app/core/notifications/events.py': [
                  ('from sqlalchemy import event, inspect',
                   'from sqlalchemy import event, inspect\nfrom sqlalchemy.engine import Connection\nfrom sqlalchemy.orm import Mapper'),
                  ('def prevent_notification_content_mutation(mapper, connection, target: Notification) -> None:  # noqa: ARG001',
                   'def prevent_notification_content_mutation(\n    _mapper: Mapper[Notification], _connection: Connection, target: Notification\n) -> None:'),
                  ('def prevent_notification_delete(mapper, connection, target: Notification) -> None:  # noqa: ARG001',
                   'def prevent_notification_delete(\n    _mapper: Mapper[Notification], _connection: Connection, target: Notification\n) -> None:'),
              ],
              'backend/app/core/people/service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('def _person_statement(person_id: UUID, *, for_update: bool = False):',
                   'def _person_statement(\n    person_id: UUID, *, for_update: bool = False\n) -> Select[tuple[Person]]:'),
                  ('                    "Deactivate access assignments rooted at this organization before deactivating the person\'s relationship."',
                   '                    "Deactivate access assignments rooted at this organization before "\n'
                   '                    "deactivating the person\'s relationship."'),
              ],
              'backend/app/core/search/service.py': [
                  ('                subtitle=f"{document.document_type} · {document.status.value if hasattr(document.status, \'value\') else document.status}",',
                   '                subtitle=(\n'
                   '                    f"{document.document_type} · "\n'
                   '                    f"{getattr(document.status, \'value\', document.status)}"\n'
                   '                ),'),
              ],
              'backend/app/core/workflow/service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Load, Session, selectinload'),
                  ('def _definition_options():',
                   'def _definition_options() -> tuple[Load, Load]:'),
                  ('def _instance_options():',
                   'def _instance_options() -> tuple[Load, Load, Load]:'),
              ],
              'backend/app/main.py': [
                  ('import app.db.session  # noqa: E402,F401',
                   'from app.db import session as _db_session  # noqa: E402,F401'),
              ],
              'backend/app/modules/customers/service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('def _customer_statement(customer_id: UUID, *, for_update: bool = False):',
                   'def _customer_statement(\n    customer_id: UUID, *, for_update: bool = False\n) -> Select[tuple[CustomerCRMRecord]]:'),
              ],
              'backend/app/modules/hr/permissions.py': [
                  ('        "View HR job profiles, planned positions, and employment records within authorized organization scope.",',
                   '        "View HR job profiles, planned positions, and employment records within "\n'
                   '        "authorized organization scope.",'),
                  ('        "Create and manage HR job profiles, positions, and employment records within authorized organization scope.",',
                   '        "Create and manage HR job profiles, positions, and employment records within "\n'
                   '        "authorized organization scope.",'),
              ],
              'backend/app/modules/hr/service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('def _position_statement(position_id: UUID, *, for_update: bool = False):',
                   'def _position_statement(\n    position_id: UUID, *, for_update: bool = False\n) -> Select[tuple[HRPosition]]:'),
                  ('def _employment_statement(employment_id: UUID, *, for_update: bool = False):',
                   'def _employment_statement(\n    employment_id: UUID, *, for_update: bool = False\n) -> Select[tuple[HREmployment]]:'),
                  ('            "Person must have an active relationship with the organization before an employment record can be created."',
                   '            "Person must have an active relationship with the organization before "\n'
                   '            "an employment record can be created."'),
                  ('    before = {\n        "is_active": employment.is_active,\n        "end_date": employment.end_date.isoformat() if employment.end_date else None,\n    }',
                   '    before: dict[str, object] = {\n        "is_active": employment.is_active,\n        "end_date": employment.end_date.isoformat() if employment.end_date else None,\n    }'),
              ],
              'backend/app/modules/suppliers/service.py': [
                  ('from sqlalchemy.orm import Session, selectinload',
                   'from sqlalchemy.orm import Session, selectinload\nfrom sqlalchemy.sql import Select'),
                  ('def _supplier_statement(supplier_id: UUID, *, for_update: bool = False):',
                   'def _supplier_statement(\n    supplier_id: UUID, *, for_update: bool = False\n) -> Select[tuple[SupplierProfile]]:'),
              ],
              'backend/app/api/v1/routes/suppliers.py': [
                  ('from app.db.session import get_db',
                   'from app.db.session import get_db\nfrom app.modules.suppliers.models import SupplierProfile, SupplierRepresentative'),
                  ('def _supplier_response(item) -> SupplierResponse:',
                   'def _supplier_response(item: SupplierProfile) -> SupplierResponse:'),
                  ('    representative,\n) -> SupplierRepresentativeResponse:',
                   '    representative: SupplierRepresentative,\n) -> SupplierRepresentativeResponse:'),
              ],
              'backend/app/api/v1/routes/customers.py': [
                  ('from app.db.session import get_db',
                   'from app.db.session import get_db\nfrom app.modules.customers.models import CustomerCRMRecord'),
                  ('def _customer_response(item) -> CustomerCRMResponse:',
                   'def _customer_response(item: CustomerCRMRecord) -> CustomerCRMResponse:'),
              ],
              'backend/tests/test_hr_api.py': [
                  ('def test_employment_relationship_dates_support_future_planning_without_exposing_not_yet_active_people(',
                   'def test_future_employment_relationship_does_not_expose_not_yet_active_people('),
              ],
          }

          for filename, pairs in replacements.items():
              for old, new in pairs:
                  replace_one(filename, old, new)
          PY

      - name: Format and validate Ruff
        working-directory: backend
        run: |
          ruff format app tests
          ruff check --fix --select I001 app/main.py
          ruff check app tests
          python -m compileall -q app

      - name: Verify only the isolated rowcount typing blocker remains
        working-directory: backend
        run: |
          set +e
          mypy app > ../mypy-remediation.txt 2>&1
          rc=$?
          set -e
          cat ../mypy-remediation.txt
          test "$rc" -ne 0
          python - <<'PY'
          from pathlib import Path
          text = Path('../mypy-remediation.txt').read_text(encoding='utf-8')
          if 'Found 1 error in 1 file' not in text:
              raise SystemExit('Expected exactly one residual mypy error.')
          if 'app/core/notifications/service.py' not in text:
              raise SystemExit('Residual mypy error is not isolated to notifications/service.py.')
          if 'has no attribute' not in text or 'rowcount' not in text:
              raise SystemExit('Residual mypy error is not the approved rowcount blocker.')
          PY

      - name: Prove audit tests are unchanged
        run: git diff --exit-code -- backend/tests/test_audit.py backend/tests/test_audit_api.py backend/tests/test_audit_security.py

      - name: Run all backend tests in isolated processes
        run: bash scripts/ci/backend-tests.sh

      - name: Validate remediation diff
        run: |
          git diff --check
          git diff --stat
          git diff -- backend/app/core/audit/service.py backend/app/core/audit/security.py

      - name: Commit and push validated safe remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests
          git commit -m 'ci: apply Claude-approved mypy-safe remediation'
          git push origin HEAD:main
