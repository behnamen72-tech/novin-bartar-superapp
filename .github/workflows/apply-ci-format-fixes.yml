name: Apply CI Format Fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-format-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply Ruff formatter only
        working-directory: backend
        run: ruff format app tests

      - name: Apply exact AsyncState prop fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/components/modules/SupplierFoundationView.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<AsyncState title="در حال آماده‌سازی تأمین‌کنندگان..." />'
          new = '<AsyncState label="در حال آماده‌سازی تأمین‌کنندگان..." />'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one AsyncState title occurrence, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat
          git diff -- frontend/components/modules/SupplierFoundationView.tsx

      - name: Commit and push with diagnostic log
        run: |
          exec > >(tee ci-format-operation.log) 2>&1
          set +e
          echo '--- pre-add status ---'
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests frontend/components/modules/SupplierFoundationView.tsx
          echo '--- staged status ---'
          git status --short
          git commit -m 'ci: format backend and fix AsyncState prop'
          commit_rc=$?
          echo "commit_rc=$commit_rc"
          git rev-parse HEAD
          if [[ $commit_rc -eq 0 ]]; then
            git push origin HEAD:main
            push_rc=$?
          else
            push_rc=99
          fi
          echo "push_rc=$push_rc"
          printf 'COMMIT_RC=%s\nPUSH_RC=%s\n' "$commit_rc" "$push_rc" > ci-format-status.env
          exit 0

      - name: Upload operation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ci-format-operation
          path: |
            ci-format-operation.log
            ci-format-status.env
          if-no-files-found: error

      - name: Require commit and push success
        run: |
          source ci-format-status.env
          test "$COMMIT_RC" -eq 0
          test "$PUSH_RC" -eq 0
