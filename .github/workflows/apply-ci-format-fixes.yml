name: Apply CI Ruff Mechanical Fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-format-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply only Ruff-provided fixes
        working-directory: backend
        run: |
          ruff check app tests --fix --unsafe-fixes || true
          ruff format app tests

      - name: Validate generated diff
        run: |
          git diff --check
          git diff --stat
          test -n "$(git diff --name-only -- backend/app backend/tests)"

      - name: Commit and push mechanical fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests
          git commit -m 'ci: apply Ruff mechanical fixes'
          git push origin HEAD:main
