name: Apply Remaining Precise Ruff Fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-format-fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply exact remaining fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'backend/app/api/v1/routes/documents.py': [
                  ('    document_type: str | None = Query(default=None, max_length=100),',
                   '    document_type: Annotated[str | None, Query(max_length=100)] = None,'),
                  ('    document_status: DocumentStatus | None = Query(default=None, alias="status"),',
                   '    document_status: Annotated[DocumentStatus | None, Query(alias="status")] = None,'),
                  ('    entity_type: DocumentLinkEntityType | None = Query(default=None),',
                   '    entity_type: Annotated[DocumentLinkEntityType | None, Query()] = None,'),
                  ('    entity_id: UUID | None = Query(default=None),',
                   '    entity_id: Annotated[UUID | None, Query()] = None,'),
                  ('    q: str | None = Query(default=None, min_length=1, max_length=200),',
                   '    q: Annotated[str | None, Query(min_length=1, max_length=200)] = None,'),
              ],
              'backend/app/api/v1/routes/workflow.py': [
                  ('    instance_status: WorkflowInstanceStatus | None = Query(default=None, alias="status"),',
                   '    instance_status: Annotated[WorkflowInstanceStatus | None, Query(alias="status")] = None,'),
              ],
              'backend/app/core/access/admin_service.py': [
                  ('                "Cannot reactivate access without an active person relationship at the assignment organization."',
                   '                "Cannot reactivate access without an active person relationship "\n'
                   '                "at the assignment organization."'),
              ],
              'backend/app/core/config.py': [
                  ('                "COMMERCE_INTEGRATION_JWT_SECRET must be a dedicated random secret of at least 32 characters."',
                   '                "COMMERCE_INTEGRATION_JWT_SECRET must be a dedicated random secret "\n'
                   '                "of at least 32 characters."'),
              ],
              'backend/app/core/documents/service.py': [
                  ('        raise original_error', '        raise original_error from None'),
              ],
              'backend/app/core/people/service.py': [
                  ('                    "Deactivate access assignments rooted at this organization before deactivating the person\'s relationship."',
                   '                    "Deactivate access assignments rooted at this organization before "\n'
                   '                    "deactivating the person\'s relationship."'),
              ],
              'backend/app/core/search/service.py': [
                  ('                subtitle=f"{document.document_type} · {document.status.value if hasattr(document.status, \'value\') else document.status}",',
                   '                subtitle=(\n'
                   '                    f"{document.document_type} · "\n'
                   '                    f"{getattr(document.status, \'value\', document.status)}"\n'
                   '                ),'),
              ],
              'backend/app/modules/hr/permissions.py': [
                  ('        "View HR job profiles, planned positions, and employment records within authorized organization scope.",',
                   '        "View HR job profiles, planned positions, and employment records within "\n'
                   '        "authorized organization scope.",'),
                  ('        "Create and manage HR job profiles, positions, and employment records within authorized organization scope.",',
                   '        "Create and manage HR job profiles, positions, and employment records within "\n'
                   '        "authorized organization scope.",'),
              ],
              'backend/app/modules/hr/service.py': [
                  ('            "Person must have an active relationship with the organization before an employment record can be created."',
                   '            "Person must have an active relationship with the organization before "\n'
                   '            "an employment record can be created."'),
              ],
              'backend/tests/test_hr_api.py': [
                  ('def test_employment_relationship_dates_support_future_planning_without_exposing_not_yet_active_people(',
                   'def test_future_employment_relationship_does_not_expose_not_yet_active_people('),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one exact match, found {count}: {old!r}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Format and validate quality
        working-directory: backend
        run: |
          ruff format app tests
          ruff check app tests
          mypy app
          python -m compileall -q app

      - name: Run all backend tests in isolated processes
        run: bash scripts/ci/backend-tests.sh

      - name: Validate diff
        run: |
          git diff --check
          git diff --stat

      - name: Commit and push validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app backend/tests
          git commit -m 'ci: resolve remaining Ruff findings'
          git push origin HEAD:main
