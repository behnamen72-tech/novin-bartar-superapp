name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend / Ruff + Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Compile Python sources
        run: python -m compileall -q app tests

  backend-tests:
    name: Backend / Pytest isolated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run all backend tests in isolated processes
        run: bash scripts/ci/backend-tests.sh

  postgres-migrations:
    name: Database / PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: novin_bartar_ci
          POSTGRES_USER: novin_bartar
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novin_bartar -d novin_bartar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://novin_bartar:ci-only-password@127.0.0.1:5432/novin_bartar_ci
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SECRET_KEY: ci-only-secret-key-which-is-at-least-32-characters-long
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Upgrade database to Alembic head
        run: alembic upgrade head

      - name: Verify a single Alembic head
        run: |
          heads="$(alembic heads | grep -c '(head)' || true)"
          test "$heads" -eq 1
          alembic current

      - name: Generate PostgreSQL offline migration SQL
        run: alembic upgrade head --sql > /tmp/alembic-upgrade-head.sql

      - name: Assert D3 primary representative partial unique index is present
        run: grep -q "uq_supplier_representative_active_primary" /tmp/alembic-upgrade-head.sql

  frontend:
    name: Frontend / Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_API_URL: http://127.0.0.1:8000/api/v1
      BACKEND_REQUEST_TIMEOUT_MS: '10000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require committed npm lockfile
        run: |
          if [[ ! -f frontend/package-lock.json ]]; then
            echo "::error file=frontend/package.json::frontend/package-lock.json is missing. Run the manual Bootstrap Frontend Lockfile workflow, commit the generated lockfile, then re-run CI."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and run frontend gates
        run: bash scripts/ci/frontend-checks.sh

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend-quality
      - backend-tests
      - postgres-migrations
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_QUALITY: ${{ needs.backend-quality.result }}
          BACKEND_TESTS: ${{ needs.backend-tests.result }}
          POSTGRES_MIGRATIONS: ${{ needs.postgres-migrations.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          printf 'backend-quality=%s\nbackend-tests=%s\npostgres-migrations=%s\nfrontend=%s\n' \
            "$BACKEND_QUALITY" "$BACKEND_TESTS" "$POSTGRES_MIGRATIONS" "$FRONTEND"
          test "$BACKEND_QUALITY" = success
          test "$BACKEND_TESTS" = success
          test "$POSTGRES_MIGRATIONS" = success
          test "$FRONTEND" = success
